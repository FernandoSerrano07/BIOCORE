<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOCORE — Acceso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .logo { font-size: 28px; font-weight: 900; color: #00b896; text-align: center; margin-bottom: 8px; }
        .sub  { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 36px; }
        label {
            display: block; color: #cbd5e1; font-size: 13px; font-weight: 600;
            margin-bottom: 6px; margin-top: 20px;
        }
        input {
            width: 100%; padding: 12px 16px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 10px; color: #f1f5f9; font-size: 15px;
            outline: none; transition: border 0.2s;
        }
        input:focus { border-color: #00b896; }
        .btn {
            width: 100%; margin-top: 28px; padding: 14px;
            background: #00b896; color: white;
            font-size: 16px; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover  { background: #00a080; }
        .btn:active { transform: scale(0.98); }
        .alerta {
            margin-top: 16px; padding: 12px 16px;
            border-radius: 8px; font-size: 14px; text-align: center;
        }
        .alerta.error   { background: rgba(239,68,68,0.12);  border: 1px solid #ef4444; color: #ef4444; }
        .alerta.warning { background: rgba(245,158,11,0.12); border: 1px solid #f59e0b; color: #f59e0b; }
        .alerta.info    { background: rgba(0,184,150,0.12);  border: 1px solid #00b896; color: #00b896; }
        .version { text-align: center; color: #334155; font-size: 11px; margin-top: 28px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">⬡ BIOCORE</div>
    <div class="sub">Panel de Administración</div>

    <form method="POST" action="/admin/login" id="form-login">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="admin@empresa.com" required autofocus autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

        <button type="submit" class="btn" id="btn-login">Ingresar</button>
    </form>

    {% if error %}
    <div class="alerta error">{{ error }}</div>
    {% endif %}

    {% if request.query_params.get('expired') %}
    <div class="alerta warning">Tu sesión expiró. Ingresa de nuevo.</div>
    {% endif %}

    {% if request.query_params.get('logout') %}
    <div class="alerta info">Sesión cerrada correctamente.</div>
    {% endif %}

    <div class="version">BIOCORE v2.0 — Sistema biométrico de asistencia</div>
</div>

<script>
document.getElementById('form-login').addEventListener('submit', function() {
    const btn = document.getElementById('btn-login');
    btn.textContent = 'Verificando...';
    btn.disabled = true;
});
</script>
</body>
</html>
