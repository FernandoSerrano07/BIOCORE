<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOCORE — Marcaje</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        .camara-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 480px;
        }
        #video {
            width: 100%;
            border-radius: 12px;
            border: none;
            display: block;
        }
        #face-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 12px;
            pointer-events: none;
        }
        .corner {
            position: absolute;
            width: 28px; height: 28px;
            border-color: #00b896;
            border-style: solid;
            opacity: 0.85;
            transition: border-color 0.3s;
        }
        .corner.sin-rostro { border-color: #9ca3af; }
        .corner-tl { top:12px; left:12px;   border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
        .corner-tr { top:12px; right:12px;  border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
        .corner-bl { bottom:12px; left:12px;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
        .corner-br { bottom:12px; right:12px; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }

        .scan-line {
            position: absolute;
            left:12px; right:12px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00b896, transparent);
            animation: scan 2.5s linear infinite;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scan-line.activa { opacity: 0.7; }
        @keyframes scan { 0% { top:10%; } 100% { top:90%; } }

        .badge-estado {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            color: #9ca3af;
            font-size: 12px; font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            transition: color 0.3s;
        }
        .badge-estado.detectado    { color: #f59e0b; }
        .badge-estado.verificando  { color: #f59e0b; }
        .badge-estado.identificado { color: #00b896; }
        .badge-estado.no-reconocido { color: #ef4444; }

        /* Panel usuario identificado estilo ZKTeco */
        .panel-usuario {
            display: none;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 2px solid #00b896;
            border-radius: 16px;
            padding: 20px 24px;
            margin: 16px 0;
            text-align: center;
            animation: aparecer 0.3s ease;
        }
        .panel-usuario.visible { display: block; }
        @keyframes aparecer {
            from { opacity:0; transform:translateY(-8px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .panel-usuario .pu-nombre {
            font-size: 26px; font-weight: 800;
            color: #ffffff; margin-bottom: 4px;
        }
        .panel-usuario .pu-cargo {
            font-size: 14px; color: #00b896;
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.5px; margin-bottom: 8px;
        }
        .panel-usuario .pu-confianza {
            font-size: 12px; color: #94a3b8;
        }
        .panel-usuario .pu-instruccion {
            margin-top: 12px;
            font-size: 13px; color: #cbd5e1;
            background: rgba(0,184,150,0.1);
            border-radius: 8px; padding: 8px 12px;
        }

        .datos-flotantes {
            position: absolute;
            top:14px; left:14px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px; color: #ffffff;
            line-height: 1.8; display: none;
        }
        .datos-flotantes.visible { display: block; }
        .datos-flotantes span { color: #00b896; font-weight: 700; }

        @keyframes pulso-verde {
            0%   { box-shadow: 0 0 0 0 rgba(0,184,150,0.6); }
            70%  { box-shadow: 0 0 0 18px rgba(0,184,150,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,184,150,0); }
        }
        .identificado-pulso { animation: pulso-verde 1s ease-out 3; }

        .btn-marcaje { transition: opacity 0.3s, transform 0.15s; }
        .btn-marcaje.deshabilitado {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="contenedor">

    <div class="header">
        <div class="logo">⬡ BIOCORE</div>
        <div class="hora-actual" id="reloj">--:--:--</div>
    </div>

    <div class="camara-box">
        <div class="camara-wrapper" id="camara-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="face-canvas"></canvas>

            <div class="corner corner-tl sin-rostro" id="c-tl"></div>
            <div class="corner corner-tr sin-rostro" id="c-tr"></div>
            <div class="corner corner-bl sin-rostro" id="c-bl"></div>
            <div class="corner corner-br sin-rostro" id="c-br"></div>

            <div class="scan-line" id="scan-line"></div>

            <div class="datos-flotantes" id="datos-flotantes">
                <div>NOMBRE: <span id="float-nombre">—</span></div>
                <div>CARGO: <span id="float-cargo">—</span></div>
                <div>CONFIANZA: <span id="float-sim">—</span></div>
            </div>

            <div class="badge-estado" id="badge-estado">CARGANDO MODELOS...</div>
        </div>
        <div class="estado-camara" id="estado-camara">Iniciando sistema...</div>
    </div>

    <!-- Panel usuario identificado (aparece automáticamente) -->
    <div class="panel-usuario" id="panel-usuario">
        <div class="pu-nombre" id="pu-nombre">—</div>
        <div class="pu-cargo"  id="pu-cargo">—</div>
        <div class="pu-confianza" id="pu-confianza">—</div>
        <div class="pu-instruccion">Selecciona el tipo de marcaje ↓</div>
    </div>

    <div class="botones-marcaje" id="botones">
        <button class="btn-marcaje btn-entrada deshabilitado"     id="btn-entrada"     onclick="iniciarMarcaje('entrada')">
            <span class="btn-icono">🟢</span> Entrada
        </button>
        <button class="btn-marcaje btn-salida-alm deshabilitado"  id="btn-salida-alm"  onclick="iniciarMarcaje('salida_almuerzo')">
            <span class="btn-icono">🍽️</span> Salida almuerzo
        </button>
        <button class="btn-marcaje btn-regreso-alm deshabilitado" id="btn-regreso-alm" onclick="iniciarMarcaje('regreso_almuerzo')">
            <span class="btn-icono">🔵</span> Regreso almuerzo
        </button>
        <button class="btn-marcaje btn-salida deshabilitado"      id="btn-salida"      onclick="iniciarMarcaje('salida')">
            <span class="btn-icono">⚫</span> Salida
        </button>
        <button class="btn-marcaje btn-imprevisto deshabilitado"  id="btn-imprevisto"  onclick="iniciarMarcaje('salida_imprevista')">
            <span class="btn-icono">🔴</span> Salida imprevista
        </button>
        <button class="btn-marcaje btn-enfermedad deshabilitado"  id="btn-enfermedad"  onclick="iniciarMarcaje('salida_enfermedad')">
            <span class="btn-icono">🟣</span> Salida enfermedad
        </button>
    </div>

    <div class="panel-confirmacion" id="panel-confirmacion">
        <div class="usuario-detectado">
            <div>
                <div class="usuario-nombre" id="usuario-nombre">—</div>
                <div class="usuario-cargo"  id="usuario-cargo">—</div>
                <div class="similitud"      id="usuario-similitud">—</div>
            </div>
        </div>
        <div class="panel-justificacion" id="panel-justificacion">
            <p style="margin-bottom:10px; color:#6b7280; font-size:14px;">
                Este marcaje requiere justificación:
            </p>
            <textarea id="texto-justificacion" placeholder="Escribe el motivo aquí..."></textarea>
            <div>
                <button class="btn-audio" id="btn-audio" onclick="toggleGrabacion()">
                    🎙️ Grabar nota de voz
                </button>
                <span id="estado-audio" style="font-size:13px; color:#6b7280;"></span>
            </div>
        </div>
        <button class="btn-confirmar" onclick="confirmarMarcaje()">
            ✅ Confirmar marcaje
        </button>
    </div>

    <div class="mensaje-resultado" id="mensaje-resultado"></div>

<div style="text-align:center; margin-top:24px;">
    <a href="/registro" style="color:#9ca3af; font-size:13px; text-decoration:none;">
        ¿Nuevo empleado? → Registrarse
    </a>
    <br>
    <a href="/admin_login" class="btn btn-primary">Iniciar Sesión Admin</a>
        ⚙️ Panel de Administración y Reportes →
    </a>
</div>

</div>

<script>
let tipoMarcajeActual  = null;
let usuarioActual      = null;
let mediaRecorder      = null;
let audioBlob          = null;
let grabando           = false;
let stream             = null;
let hayRostro          = false;
let identificandoAuto  = false;   // hay una petición en vuelo
let framesSinRostro    = 0;
const FRAMES_RESET     = 15;      // ciclos sin rostro para limpiar UI
const INTERVALO_AUTO   = 2500;    // ms entre verificaciones automáticas

// RELOJ
function actualizarReloj() {
    document.getElementById('reloj').textContent =
        new Date().toLocaleTimeString('es-SV');
}
setInterval(actualizarReloj, 1000);
actualizarReloj();

// INICIO
async function iniciar() {
    try {
        setBadge('CARGANDO MODELOS...', '');
        await faceapi.nets.tinyFaceDetector.loadFromUri('/static/models');

        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const video = document.getElementById('video');
        video.srcObject = stream;

        video.addEventListener('loadedmetadata', () => {
            ajustarCanvas();
            iniciarDeteccion();
        });

        setBadge('BUSCANDO ROSTRO...', '');
        document.getElementById('estado-camara').textContent = 'Colócate frente a la cámara';
    } catch(e) {
        document.getElementById('estado-camara').textContent = 'Error: ' + e.message;
    }
}

function ajustarCanvas() {
    const video  = document.getElementById('video');
    const canvas = document.getElementById('face-canvas');
    canvas.width  = video.offsetWidth;
    canvas.height = video.offsetHeight;
}

// DETECCIÓN + IDENTIFICACIÓN AUTOMÁTICA
async function iniciarDeteccion() {
    const video  = document.getElementById('video');
    const canvas = document.getElementById('face-canvas');
    const ctx    = canvas.getContext('2d');
    let frame    = 0;

    async function loop() {
        frame++;
        canvas.width  = video.offsetWidth;
        canvas.height = video.offsetHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (frame % 8 === 0) {
            const detecciones = await faceapi.detectAllFaces(
                video,
                new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 })
            );
            hayRostro = detecciones.length > 0;

            if (hayRostro) {
                framesSinRostro = 0;
                dibujarCajaFacial(ctx, detecciones[0], canvas, frame);

                // Si no hay usuario identificado y no hay petición en vuelo → identificar
                if (!usuarioActual && !identificandoAuto) {
                    identificacionAutomatica();
                }
            } else {
                framesSinRostro++;
                if (framesSinRostro >= FRAMES_RESET) {
                    resetearUI();
                }
            }

            actualizarCornersYScan(hayRostro);
        }

        requestAnimationFrame(loop);
    }

    loop();
}

async function identificacionAutomatica() {
    identificandoAuto = true;
    setBadge('VERIFICANDO...', 'verificando');

    try {
        const videoEl   = document.getElementById('video');
        const capCanvas = document.createElement('canvas');
        capCanvas.width  = videoEl.videoWidth  || 640;
        capCanvas.height = videoEl.videoHeight || 480;
        capCanvas.getContext('2d').drawImage(videoEl, 0, 0);

        const blob = await new Promise(resolve => capCanvas.toBlob(resolve, 'image/jpeg', 0.85));
        const formData = new FormData();
        formData.append('foto', blob, 'frame.jpg');

        const respuesta = await fetch('/api/marcaje/verificar', { method: 'POST', body: formData });
        const datos     = await respuesta.json();

        if (datos.identificado) {
            usuarioActual = datos;
            mostrarPanelUsuario(datos);
            habilitarBotones();
            setBadge('✓ IDENTIFICADO', 'identificado');
            document.getElementById('video').classList.add('identificado-pulso');
            setTimeout(() => document.getElementById('video').classList.remove('identificado-pulso'), 3000);

            // Datos flotantes sobre la cámara
            document.getElementById('float-nombre').textContent = datos.nombre;
            document.getElementById('float-cargo').textContent  = datos.cargo;
            document.getElementById('float-sim').textContent    = datos.similitud + '%';
            document.getElementById('datos-flotantes').classList.add('visible');
        } else {
            setBadge('NO RECONOCIDO', 'no-reconocido');
            // Reintentar después del intervalo
            setTimeout(() => {
                identificandoAuto = false;
                if (hayRostro && !usuarioActual) setBadge('ROSTRO DETECTADO', 'detectado');
            }, INTERVALO_AUTO);
            return;
        }
    } catch(e) {
        console.error('Error identificación automática:', e);
    }

    identificandoAuto = false;
}

function mostrarPanelUsuario(datos) {
    document.getElementById('pu-nombre').textContent    = datos.nombre;
    document.getElementById('pu-cargo').textContent     = datos.cargo;
    document.getElementById('pu-confianza').textContent = `Confianza: ${datos.similitud}%`;
    document.getElementById('panel-usuario').classList.add('visible');
    document.getElementById('estado-camara').textContent = `✅ Bienvenido, ${datos.nombre.split(' ')[0]}`;
}

function habilitarBotones() {
    document.querySelectorAll('.btn-marcaje').forEach(b => b.classList.remove('deshabilitado'));
}

function deshabilitarBotones() {
    document.querySelectorAll('.btn-marcaje').forEach(b => b.classList.add('deshabilitado'));
}

function resetearUI() {
    if (identificandoAuto) return;
    usuarioActual = null;
    framesSinRostro = 0;
    document.getElementById('panel-usuario').classList.remove('visible');
    document.getElementById('datos-flotantes').classList.remove('visible');
    document.getElementById('panel-confirmacion').classList.remove('visible');
    document.getElementById('mensaje-resultado').className = 'mensaje-resultado';
    document.getElementById('estado-camara').textContent = 'Colócate frente a la cámara';
    deshabilitarBotones();
    setBadge('BUSCANDO ROSTRO...', '');
}

function dibujarCajaFacial(ctx, deteccion, canvas, frame) {
    const video  = document.getElementById('video');
    const scaleX = canvas.width  / video.videoWidth;
    const scaleY = canvas.height / video.videoHeight;
    const box = deteccion.box;
    const x = box.x * scaleX, y = box.y * scaleY;
    const w = box.width * scaleX, h = box.height * scaleY;
    const pulso = 0.7 + 0.3 * Math.sin(frame * 0.15);

    ctx.strokeStyle = `rgba(0,184,150,${pulso})`;
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);

    const puntos = [
        {rx:0.30, ry:0.35}, {rx:0.70, ry:0.35},
        {rx:0.50, ry:0.55},
        {rx:0.35, ry:0.75}, {rx:0.65, ry:0.75},
        {rx:0.28, ry:0.28}, {rx:0.72, ry:0.28},
    ];
    puntos.forEach(p => {
        ctx.beginPath();
        ctx.arc(x + w * p.rx, y + h * p.ry, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,184,150,${pulso})`;
        ctx.fill();
    });
}

function actualizarCornersYScan(rostro) {
    const corners  = ['c-tl','c-tr','c-bl','c-br'];
    const scanLine = document.getElementById('scan-line');
    corners.forEach(id => {
        document.getElementById(id).classList.toggle('sin-rostro', !rostro);
    });
    scanLine.classList.toggle('activa', rostro);
    if (rostro && !usuarioActual && !identificandoAuto) {
        setBadge('ROSTRO DETECTADO', 'detectado');
    }
}

// MARCAJE — ya solo confirma, el usuario ya fue identificado automáticamente
const TIPOS_ESPECIALES = ['salida_imprevista', 'salida_enfermedad'];

async function iniciarMarcaje(tipo) {
    if (!usuarioActual) return;

    tipoMarcajeActual = tipo;
    audioBlob         = null;

    document.getElementById('usuario-nombre').textContent = usuarioActual.nombre;
    document.getElementById('usuario-cargo').textContent  = usuarioActual.cargo;
    document.getElementById('usuario-similitud').textContent = `Confianza: ${usuarioActual.similitud}%`;

    const panelJust = document.getElementById('panel-justificacion');
    TIPOS_ESPECIALES.includes(tipo)
        ? panelJust.classList.add('visible')
        : panelJust.classList.remove('visible');

    document.getElementById('texto-justificacion').value = '';
    document.getElementById('panel-confirmacion').classList.add('visible');
    document.getElementById('mensaje-resultado').className = 'mensaje-resultado';
}

async function confirmarMarcaje() {
    if (!usuarioActual) return;

    const justificacion = document.getElementById('texto-justificacion').value;
    const esEspecial    = TIPOS_ESPECIALES.includes(tipoMarcajeActual);

    if (esEspecial && !justificacion && !audioBlob) {
        mostrarError('Debes agregar una justificación escrita o nota de voz.');
        return;
    }

    const formData = new FormData();
    formData.append('usuario_id', usuarioActual.usuario_id);
    formData.append('tipo', tipoMarcajeActual);
    if (justificacion) formData.append('justificacion_texto', justificacion);

    try {
        const respuesta = await fetch('/api/marcaje/registrar', { method: 'POST', body: formData });
        const datos     = await respuesta.json();

        if (audioBlob && datos.marcaje_id) {
            const formAudio = new FormData();
            formAudio.append('audio', audioBlob, 'nota_voz.webm');
            await fetch(`/api/marcaje/audio/${datos.marcaje_id}`, { method: 'POST', body: formAudio });
        }

        mostrarExito(`✅ ${formatearTipo(tipoMarcajeActual)} registrado — ${usuarioActual.nombre}`);
        document.getElementById('panel-confirmacion').classList.remove('visible');
        document.getElementById('panel-usuario').classList.remove('visible');
        document.getElementById('datos-flotantes').classList.remove('visible');
        deshabilitarBotones();

        setTimeout(() => {
            document.getElementById('mensaje-resultado').className = 'mensaje-resultado';
            tipoMarcajeActual = null;
            usuarioActual     = null;
            document.getElementById('estado-camara').textContent = 'Colócate frente a la cámara';
        }, 4000);

    } catch(e) {
        mostrarError('Error al registrar: ' + e.message);
    }
}

// AUDIO
async function toggleGrabacion() {
    if (!grabando) {
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder     = new MediaRecorder(audioStream);
        const chunks      = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
            audioBlob = new Blob(chunks, { type: 'audio/webm' });
            document.getElementById('estado-audio').textContent = '✅ Nota de voz grabada';
        };
        mediaRecorder.start();
        grabando = true;
        document.getElementById('btn-audio').textContent = '⏹️ Detener grabación';
        document.getElementById('btn-audio').classList.add('grabando');
        document.getElementById('estado-audio').textContent = '🔴 Grabando...';
    } else {
        mediaRecorder.stop();
        grabando = false;
        document.getElementById('btn-audio').textContent = '🎙️ Grabar nota de voz';
        document.getElementById('btn-audio').classList.remove('grabando');
    }
}

// UTILIDADES
function setBadge(texto, clase) {
    const badge = document.getElementById('badge-estado');
    badge.textContent = texto;
    badge.className   = 'badge-estado ' + clase;
}

function formatearTipo(tipo) {
    const nombres = {
        'entrada':           'Entrada',
        'salida_almuerzo':   'Salida almuerzo',
        'regreso_almuerzo':  'Regreso almuerzo',
        'salida':            'Salida',
        'salida_imprevista': 'Salida imprevista',
        'salida_enfermedad': 'Salida por enfermedad'
    };
    return nombres[tipo] || tipo;
}

function mostrarExito(msg) {
    const el = document.getElementById('mensaje-resultado');
    el.textContent = msg;
    el.className   = 'mensaje-resultado exito';
}

function mostrarError(msg) {
    const el = document.getElementById('mensaje-resultado');
    el.textContent = msg;
    el.className   = 'mensaje-resultado error';
}

iniciar();
</script>
</body>
</html>
